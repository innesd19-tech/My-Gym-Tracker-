<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>My Gym Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef3fa;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:25px 17px 105px}h1{font-size:29px;margin:5px 0}h2{font-size:19px;margin:0 0 14px}p{color:#9aaac0}.eyebrow{color:#77e4bb;font-size:12px;font-weight:800;letter-spacing:1.7px}.card{background:#172337;border:1px solid #29374c;border-radius:19px;padding:18px;margin-top:16px}.muted{color:#9aaac0;font-size:13px}.statrow,.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.statrow>div{flex:1;background:#101b2c;padding:13px;border-radius:13px}.big{font-size:24px;font-weight:800}.button{background:#64dfad;color:#09201b;border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer}.secondary{background:#2c3b52;color:#fff}.danger{background:#563142;color:#ffd9e1}.full{width:100%}button:disabled{opacity:.5}.small{padding:8px 11px;font-size:12px}input,select{background:#0f1a2b;color:white;border:1px solid #3a4b62;border-radius:10px;padding:12px;width:100%;font-size:16px}label{display:block;color:#b9c7d8;font-size:13px;margin:11px 0 5px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.exercise{padding:14px 0;border-bottom:1px solid #344155}.exercise:last-child{border:0}.pill{border-radius:99px;background:#21433d;color:#85edc4;padding:6px 10px;font-size:12px}.set{display:grid;grid-template-columns:35px 1fr 1fr 40px;gap:7px;align-items:center;margin:8px 0}.set input{text-align:center;padding:9px 3px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111b2b;border-top:1px solid #314159;display:flex;justify-content:center;padding:10px 5px calc(10px + env(safe-area-inset-bottom))}.nav button{width:25%;max-width:155px;background:none;border:0;color:#98a8bd;padding:9px 1px;font-size:12px}.nav button.active{color:#64dfad;font-weight:800}.hidden{display:none}.history{padding:13px 0;border-bottom:1px solid #344155}.history:last-child{border:0}.empty{text-align:center;padding:24px;color:#9aaac0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}small{color:#9aaac0}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#64dfad;color:#09201b;padding:10px 15px;border-radius:10px;font-weight:700;display:none;z-index:5}canvas{width:100%;height:170px}.bar{height:8px;background:#29384b;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#64dfad}
</style></head><body><div id="toast"></div><main><div class="eyebrow">TRAIN SMARTER · GET STRONGER</div><h1>My Gym Tracker</h1><p id="subtitle">Your training, all in one place.</p><section id="home"></section><section id="workout" class="hidden"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"></section></main><nav class="nav"><button data-tab="home" class="active">⌂<br>Home</button><button data-tab="workout">▣<br>Workout</button><button data-tab="history">◷<br>History</button><button data-tab="progress">↗<br>Progress</button></nav><script>
const KEY='my-gym-tracker-v1';const defaults=[{name:'Chest & Triceps',exercises:['Barbell Bench Press','Incline Dumbbell Press','Cable Chest Fly','Triceps Pushdown','Overhead Triceps Extension']},{name:'Legs A',exercises:['Barbell Squat','Leg Press','Romanian Deadlift','Leg Extension','Standing Calf Raise']},{name:'Back & Biceps',exercises:['Lat Pulldown','Seated Cable Row','Chest Supported Row','Dumbbell Curl','Hammer Curl']},{name:'Legs B',exercises:['Hack Squat','Walking Lunge','Leg Curl','Hip Thrust','Seated Calf Raise']},{name:'Upper Body',exercises:['Dumbbell Shoulder Press','Pull Up','Incline Chest Press','Lateral Raise','Cable Row']}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.history))state={programs:defaults,history:[],active:null};if(!Array.isArray(state.programs))state.programs=defaults;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1900)}function tab(t){for(let x of ['home','workout','history','progress'])$(x).classList.toggle('hidden',x!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function latest(ex){for(const w of [...state.history].reverse())for(const e of w.exercises)if(e.name===ex&&e.sets.length)return e.sets[e.sets.length-1];return null}function start(i){if(state.active&&!confirm('Replace the unfinished workout?'))return;const p=state.programs[i];state.active={name:p.name,started:new Date().toISOString(),exercises:p.exercises.map(name=>({name,sets:[]}))};save();tab('workout')}function renderHome(){const total=state.history.length;const week=state.history.filter(w=>Date.now()-new Date(w.ended)<7*864e5).length;$('home').innerHTML=`<div class="card"><div class="statrow"><div><div class="big">${week}</div><small>Last 7 days</small></div><div><div class="big">${total}</div><small>Total workouts</small></div></div><h2 style="margin-top:22px">${state.active?'Continue your workout':'Choose a workout'}</h2>${state.active?`<button class="button full" onclick="tab('workout')">Continue ${esc(state.active.name)}</button>`:''}<div id="programs"></div></div><div class="card"><h2>Make it yours</h2><p class="muted">Edit your training split and exercise names below. Your workout history will stay saved.</p><button class="button secondary full" onclick="editPrograms()">Edit training program</button></div>`;$('programs').innerHTML=state.programs.map((p,i)=>`<div class="exercise flex"><div><strong>${esc(p.name)}</strong><div class="muted">${p.exercises.length} exercises</div></div><button class="button small" onclick="start(${i})">Start →</button></div>`).join('')}
function renderWorkout(){const w=state.active;if(!w){$('workout').innerHTML='<div class="card empty">No workout in progress.<br><br><button class="button" onclick="tab(\'home\')">Choose workout</button></div>';return}$('workout').innerHTML=`<div class="card"><div class="flex"><h2>${esc(w.name)}</h2><span class="pill">IN PROGRESS</span></div><p class="muted">Started ${new Date(w.started).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'})}</p>${w.exercises.map((e,i)=>`<div class="exercise"><div class="flex"><strong>${esc(e.name)}</strong><span class="muted">${e.sets.length} sets</span></div><p class="muted">Last time: ${latest(e.name)?`${latest(e.name).weight} kg × ${latest(e.name).reps} reps`:'No previous result'}</p><div class="set muted"><span>Set</span><span style="text-align:center">kg</span><span style="text-align:center">reps</span><span></span></div>${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input type="number" inputmode="decimal" min="0" step="0.5" value="${s.weight}" onchange="updateSet(${i},${j},'weight',this.value)"><input type="number" inputmode="numeric" min="1" value="${s.reps}" onchange="updateSet(${i},${j},'reps',this.value)"><button class="button danger small" aria-label="Remove set" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<button class="button secondary small" onclick="addSet(${i})">+ Add set</button></div>`).join('')}<div class="actions"><button class="button" onclick="finish()">Finish workout ✓</button><button class="button danger" onclick="discard()">Discard</button></div></div>`}
function addSet(i){const e=state.active.exercises[i],s=e.sets.at(-1)||latest(e.name)||{weight:0,reps:10};e.sets.push({...s});save();renderWorkout()}function updateSet(i,j,k,v){state.active.exercises[i].sets[j][k]=Number(v)||0;save()}function removeSet(i,j){state.active.exercises[i].sets.splice(j,1);save();renderWorkout()}function finish(){const w=state.active;if(!w.exercises.some(e=>e.sets.length)){toast('Add a set first');return}w.ended=new Date().toISOString();state.history.push(w);state.active=null;save();toast('Workout saved!');tab('history')}function discard(){if(confirm('Discard this unfinished workout?')){state.active=null;save();tab('home')}}
function renderHistory(){const ws=[...state.history].reverse();$('history').innerHTML=`<div class="card"><h2>Workout history</h2>${ws.length?ws.map((w,i)=>`<div class="history"><div class="flex"><strong>${esc(w.name)}</strong><span class="muted">${new Date(w.ended).toLocaleDateString('en-AU')}</span></div><div class="muted">${w.exercises.reduce((n,e)=>n+e.sets.length,0)} sets · ${w.exercises.filter(e=>e.sets.length).length} exercises</div><details><summary class="muted" style="margin-top:8px">View session</summary>${w.exercises.filter(e=>e.sets.length).map(e=>`<p><strong>${esc(e.name)}</strong><br>${e.sets.map(s=>`${s.weight} kg × ${s.reps}`).join(' · ')}</p>`).join('')}<button class="button danger small" onclick="deleteHistory(${state.history.length-1-i})">Delete session</button></details></div>`).join(''):'<div class="empty">Your completed workouts will appear here.</div>'}</div><div class="card"><h2>Back up your data</h2><p class="muted">Data is stored on this device and browser. Export a backup regularly, especially before changing phones or clearing Safari data.</p><div class="actions"><button class="button secondary" onclick="exportData()">Export backup</button><label class="button secondary" style="margin:0">Import backup<input type="file" accept="application/json" onchange="importData(this)" style="display:none"></label></div></div>`}function deleteHistory(i){if(confirm('Permanently delete this session?')){state.history.splice(i,1);save();render()}}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='gym-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(input){const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.history)||!Array.isArray(data.programs))throw Error('Invalid backup');if(!confirm('Replace your current workouts with this backup?'))return;state=data;save();render();toast('Backup restored')}catch(e){alert('Could not import backup: '+e.message)}}
function renderProgress(){let all={};for(const w of state.history)for(const e of w.exercises)for(const s of e.sets)if(s.weight>0){all[e.name]=Math.max(all[e.name]||0,s.weight)}const entries=Object.entries(all).sort((a,b)=>b[1]-a[1]);$('progress').innerHTML=`<div class="card"><h2>Personal bests</h2><p class="muted">Heaviest recorded working-set weight per exercise.</p>${entries.length?entries.map(([name,kg])=>`<div class="exercise flex"><strong>${esc(name)}</strong><span class="pill">${kg} kg</span></div>`).join(''):'<div class="empty">Log workouts to see your progress.</div>'}</div><div class="card"><h2>Training consistency</h2><p class="muted">Workouts in the last 7 days</p><div class="big">${state.history.filter(w=>Date.now()-new Date(w.ended)<7*864e5).length} / 5</div><div class="bar"><span style="width:${Math.min(100,state.history.filter(w=>Date.now()-new Date(w.ended)<7*864e5).length/5*100)}%"></span></div></div>`}function editPrograms(){const p=state.programs.map(x=>x.name+'\n'+x.exercises.join('\n')).join('\n\n');const v=prompt('Edit programs: first line is workout name, following lines are exercises. Separate workouts with a blank line.',p);if(v===null)return;const programs=v.trim().split(/\n\s*\n/).map(b=>{const lines=b.split('\n').map(s=>s.trim()).filter(Boolean);return{name:lines[0],exercises:lines.slice(1)}}).filter(p=>p.name&&p.exercises.length);if(!programs.length){alert('Add at least one workout and exercise.');return}state.programs=programs;save();render();toast('Program updated')}function render(){renderHome();renderWorkout();renderHistory();renderProgress()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
