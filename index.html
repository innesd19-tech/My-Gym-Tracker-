<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>My Gym Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef3fa;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:25px 17px 105px}h1{font-size:29px;margin:5px 0}h2{font-size:19px;margin:0 0 14px}p{color:#9aaac0}.eyebrow{color:#77e4bb;font-size:12px;font-weight:800;letter-spacing:1.7px}.card{background:#172337;border:1px solid #29374c;border-radius:19px;padding:18px;margin-top:16px}.muted{color:#9aaac0;font-size:13px}.statrow,.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.statrow>div{flex:1;background:#101b2c;padding:13px;border-radius:13px}.big{font-size:24px;font-weight:800}.button{background:#64dfad;color:#09201b;border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer}.secondary{background:#2c3b52;color:#fff}.danger{background:#563142;color:#ffd9e1}.full{width:100%}button:disabled{opacity:.5}.small{padding:8px 11px;font-size:12px}input,select{background:#0f1a2b;color:white;border:1px solid #3a4b62;border-radius:10px;padding:12px;width:100%;font-size:16px}label{display:block;color:#b9c7d8;font-size:13px;margin:11px 0 5px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.exercise{padding:14px 0;border-bottom:1px solid #344155}.exercise:last-child{border:0}.pill{border-radius:99px;background:#21433d;color:#85edc4;padding:6px 10px;font-size:12px}.set{display:grid;grid-template-columns:35px 1fr 1fr 40px;gap:7px;align-items:center;margin:8px 0}.set input{text-align:center;padding:9px 3px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111b2b;border-top:1px solid #314159;display:flex;justify-content:center;padding:10px 5px calc(10px + env(safe-area-inset-bottom))}.nav button{width:25%;max-width:155px;background:none;border:0;color:#98a8bd;padding:9px 1px;font-size:12px}.nav button.active{color:#64dfad;font-weight:800}.hidden{display:none}.history{padding:13px 0;border-bottom:1px solid #344155}.history:last-child{border:0}.empty{text-align:center;padding:24px;color:#9aaac0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}small{color:#9aaac0}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#64dfad;color:#09201b;padding:10px 15px;border-radius:10px;font-weight:700;display:none;z-index:5}canvas{width:100%;height:170px}.bar{height:8px;background:#29384b;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#64dfad}

.timerbox{background:linear-gradient(135deg,#163b39,#15283d);border:1px solid #376e67;border-radius:16px;padding:16px;margin:14px 0}.timerclock{font-size:39px;font-variant-numeric:tabular-nums;font-weight:850;letter-spacing:1px}.timerlabel{font-size:12px;color:#a7e4d0;text-transform:uppercase;letter-spacing:1px}.target{color:#83e7bd;font-size:12px;margin-top:5px}.restchoices{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.restchoices button{flex:1;min-width:58px}.superset{font-size:12px;color:#ffd99a;background:#473b2d;padding:5px 8px;border-radius:7px;display:inline-block;margin:7px 0}.timeractions{display:flex;gap:8px;flex-wrap:wrap}.timeractions button{flex:1}.hint{font-size:12px;color:#c2d2e2;margin:9px 0}.sectiontitle{font-size:14px;font-weight:700;color:#c2d2e2;margin:10px 0}

.editor-panel{position:fixed;inset:0;background:#0b1220;z-index:20;overflow:auto;padding:22px 16px 100px}.editor-inner{max-width:650px;margin:auto}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.editor-row{background:#172337;border:1px solid #30425a;border-radius:14px;padding:13px;margin:10px 0}.editor-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.editor-actions button{flex:1}.editor-note{background:#16332e;border-radius:12px;padding:12px;color:#b5ead6;font-size:13px;margin:12px 0}.editor-panel .button{min-height:42px}
</style></head><body><div id="toast"></div><div id="editor" class="editor-panel hidden"></div><main><div class="eyebrow">TRAIN SMARTER · GET STRONGER</div><h1>My Gym Tracker</h1><p id="subtitle">Your training, all in one place.</p><section id="home"></section><section id="workout" class="hidden"></section><section id="history" class="hidden"></section><section id="progress" class="hidden"></section></main><nav class="nav"><button data-tab="home" class="active">⌂<br>Home</button><button data-tab="workout">▣<br>Workout</button><button data-tab="history">◷<br>History</button><button data-tab="progress">↗<br>Progress</button></nav><script>
const KEY='my-gym-tracker-v1';
const oldNames=['Chest & Triceps','Legs A','Back & Biceps','Legs B','Upper Body'];
const defaults=[
{name:'Full Body A',exercises:[
{name:'Incline Dumbbell Press',sets:3,reps:'8–12'},
{name:'Barbell Squats',sets:3,reps:'6–8'},
{name:'Dumbbell Chest-Supported Row',sets:3,reps:'8–12'},
{name:'Leg Curls',sets:3,reps:'10–15'},
{name:'Incline Dumbbell Curls',sets:3,reps:'8–12',superset:'A'},
{name:'Dumbbell Tricep Overhead Extensions',sets:3,reps:'8–12',superset:'A'}]},
{name:'Full Body B',exercises:[
{name:'Barbell Bench Press',sets:3,reps:'4–6'},
{name:'Romanian Deadlift',sets:3,reps:'6–8'},
{name:'Lat Pulldown',sets:3,reps:'8–12'},
{name:'Walking Lunges',sets:3,reps:'6–10'},
{name:'Cable Lateral Raises',sets:3,reps:'10–15',superset:'B'},
{name:'Reverse Crunches',sets:3,reps:'10–15',superset:'B'}]},
{name:'Full Body C',exercises:[
{name:'Seated Dumbbell Shoulder Press',sets:3,reps:'8–12'},
{name:'Dumbbell Row',sets:3,reps:'8–12'},
{name:'Barbell Hip Thrust',sets:3,reps:'10–15'},
{name:'Leg Extensions',sets:3,reps:'10–15'},
{name:'Seated Chest Flyes',sets:3,reps:'10–15'},
{name:'Standing Calf Raises',sets:3,reps:'10–15',superset:'C'},
{name:'Reverse Cable Flyes',sets:3,reps:'10–15',superset:'C'}]}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!state||!Array.isArray(state.history))state={programs:defaults,history:[],active:null};
if(!Array.isArray(state.programs))state.programs=defaults;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exName=e=>typeof e==='string'?e:e.name;
const exMeta=e=>typeof e==='string'?{name:e,sets:3,reps:'8–12'}:e;
const seconds=n=>{n=Math.max(0,Math.floor(n));return `${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n%3600/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
const restClock=n=>{n=Math.max(0,Math.ceil(n));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1900)}
// Upgrade only the untouched original five-day program; retain custom programs, active sessions and history.
if(state.programs.length===5&&state.programs.every((p,i)=>p.name===oldNames[i])){state.programs=defaults;save()}
let rest={end:null,remaining:90,running:false,duration:90};
function tab(t){closeEditor();for(const x of ['home','workout','history','progress'])$(x).classList.toggle('hidden',x!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function latestSets(ex){for(const w of [...state.history].reverse())for(const e of w.exercises||[])if(e.name===ex&&e.sets?.length)return e.sets;return []}
function latest(ex){return latestSets(ex).at(-1)||null}
function nextIndex(){if(!state.history.length)return 0;const last=state.history.at(-1).name;const idx=state.programs.findIndex(p=>p.name===last);return idx<0?0:(idx+1)%state.programs.length}
function start(i){if(state.active&&!confirm('Replace the unfinished workout?'))return;const p=state.programs[i];state.active={name:p.name,started:new Date().toISOString(),exercises:p.exercises.map(e=>({...exMeta(e),sets:[]}))};rest={end:null,remaining:90,running:false,duration:90};save();tab('workout')}
function renderHome(){const total=state.history.length;const week=state.history.filter(w=>Date.now()-new Date(w.ended)<7*864e5).length;const next=nextIndex();$('home').innerHTML=`<div class="card"><div class="statrow"><div><div class="big">${week} / 3</div><small>Last 7 days</small></div><div><div class="big">${total}</div><small>Total workouts</small></div></div><h2 style="margin-top:22px">${state.active?'Continue your workout':'Your next workout'}</h2>${state.active?`<button class="button full" onclick="tab('workout')">Continue ${esc(state.active.name)} →</button>`:`<button class="button full" onclick="start(${next})">Start ${esc(state.programs[next]?.name||'Workout')} →</button>`}<div class="sectiontitle">All workouts</div>${state.programs.map((p,i)=>`<div class="exercise flex"><div><strong>${esc(p.name)}</strong><div class="muted">${p.exercises.length} exercises</div></div><div class="actions"><button class="button small secondary" onclick="openEditor('program',${i})">Edit</button><button class="button small secondary" onclick="start(${i})">Start</button></div></div>`).join('')}</div><div class="card"><h2>Training program</h2><p class="muted">Full-body training three times per week. Your session history is stored separately from your program.</p><div class="actions"><button class="button secondary" onclick="openEditor('program',0)">Edit workout programs</button><button class="button secondary" onclick="restoreProgram()">Load A / B / C plan</button></div></div>`}
function restoreProgram(){if(!confirm('Replace your current program with the Full Body A/B/C plan? Completed workout history will be kept.'))return;state.programs=defaults;save();render();toast('A / B / C loaded')}
function restRemaining(){return rest.running?Math.max(0,(rest.end-Date.now())/1000):rest.remaining}
function setRestDuration(n){rest={end:null,remaining:n,running:false,duration:n};updateClocks()}
function startRest(n=rest.duration){rest={end:Date.now()+n*1000,remaining:n,running:true,duration:rest.duration};updateClocks()}
function pauseRest(){rest.remaining=restRemaining();rest.running=false;rest.end=null;updateClocks()}
function resumeRest(){startRest(rest.remaining||rest.duration)}
function skipRest(){rest.running=false;rest.end=null;rest.remaining=0;updateClocks()}
function renderWorkout(){const w=state.active;if(!w){$('workout').innerHTML='<div class="card empty">No workout in progress.<br><br><button class="button" onclick="tab(\'home\')">Choose workout</button></div>';return}
$('workout').innerHTML=`<div class="card"><div class="flex"><h2>${esc(w.name)}</h2><span class="pill">IN PROGRESS</span></div><div class="timerbox"><div class="timerlabel">Workout duration</div><div class="timerclock" id="workoutClock">00:00:00</div><div class="hint">Automatically runs from the moment you start your workout.</div></div><div class="timerbox"><div class="flex"><div><div class="timerlabel">Rest timer</div><div class="timerclock" id="restClock">01:30</div></div><span class="pill" id="restStatus">READY</span></div><div class="restchoices">${[60,90,120,180].map(n=>`<button class="button small ${rest.duration===n?'':'secondary'}" onclick="setRestDuration(${n})">${n}s</button>`).join('')}</div><div class="timeractions"><button class="button small" id="restToggle" onclick="toggleRest()">Start rest</button><button class="button secondary small" onclick="skipRest()">Skip</button></div><div class="hint">Starts automatically when you add a set. Timers use real elapsed time.</div></div><div class="editor-note">Change your session on the fly without changing your regular plan, or save changes permanently.</div><button class="button secondary full" onclick="openEditor('session')">✎ Edit this workout · Swap / Add / Reorder</button>${w.exercises.map((e,i)=>{const previous=latestSets(e.name);const target=e.reps?`${e.setsTarget||3} sets × ${esc(e.reps)} reps`:'';return `<div class="exercise"><div class="flex"><strong>${esc(e.name)}</strong><button class="button small secondary" onclick="openEditor('session',${i})">Swap / Edit</button></div><div class="muted">${e.sets.length} logged</div>${e.superset?`<span class="superset">Superset ${esc(e.superset)}</span>`:''}${target?`<div class="target">Target: ${target}</div>`:''}<p class="muted">${previous.length?`Previous: ${previous.map(s=>`${Number(s.weight)||0} kg × ${Number(s.reps)||0}`).join(' · ')}`:'No previous result yet'}</p><div class="set muted"><span>Set</span><span style="text-align:center">kg</span><span style="text-align:center">reps</span><span></span></div>${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input aria-label="Weight set ${j+1}" type="number" inputmode="decimal" min="0" step="0.5" value="${Number(s.weight)||0}" onchange="updateSet(${i},${j},'weight',this.value)"><input aria-label="Reps set ${j+1}" type="number" inputmode="numeric" min="0" value="${Number(s.reps)||0}" onchange="updateSet(${i},${j},'reps',this.value)"><button class="button danger small" aria-label="Remove set" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<button class="button secondary small" onclick="addSet(${i})">+ Log set</button></div>`}).join('')}<div class="actions"><button class="button" onclick="finish()">Finish workout ✓</button><button class="button danger" onclick="discard()">Discard</button></div></div>`;updateClocks()}
function toggleRest(){rest.running?pauseRest():resumeRest()}
function updateClocks(){if(!state.active)return;const wc=$('workoutClock'),rc=$('restClock');if(wc)wc.textContent=seconds((Date.now()-new Date(state.active.started).getTime())/1000);if(rest.running&&restRemaining()<=0){rest.running=false;rest.remaining=0;rest.end=null;toast('Rest complete — next set!');if(navigator.vibrate)navigator.vibrate([180,90,180])}if(rc)rc.textContent=restClock(restRemaining());if($('restStatus'))$('restStatus').textContent=rest.running?'RESTING':rest.remaining<=0?'DONE':'READY';if($('restToggle'))$('restToggle').textContent=rest.running?'Pause':rest.remaining<=0?'Restart rest':'Start rest'}
setInterval(updateClocks,500);
function addSet(i){const e=state.active.exercises[i],s=e.sets.at(-1)||latest(e.name)||{weight:0,reps:10};e.sets.push({weight:Number(s.weight)||0,reps:Number(s.reps)||0});save();startRest(rest.duration);renderWorkout()}
function updateSet(i,j,k,v){state.active.exercises[i].sets[j][k]=Number(v)||0;save()}
function removeSet(i,j){state.active.exercises[i].sets.splice(j,1);save();renderWorkout()}
function finish(){const w=state.active;if(!w.exercises.some(e=>e.sets.length)){toast('Add a set first');return}w.ended=new Date().toISOString();w.durationSeconds=Math.max(0,Math.floor((new Date(w.ended)-new Date(w.started))/1000));state.history.push(w);state.active=null;rest.running=false;save();toast('Workout saved!');tab('history')}
function discard(){if(confirm('Discard this unfinished workout?')){state.active=null;rest.running=false;save();tab('home')}}
function renderHistory(){const ws=[...state.history].reverse();$('history').innerHTML=`<div class="card"><h2>Workout history</h2>${ws.length?ws.map((w,i)=>`<div class="history"><div class="flex"><strong>${esc(w.name)}</strong><span class="muted">${new Date(w.ended).toLocaleDateString('en-AU')}</span></div><div class="muted">${w.exercises.reduce((n,e)=>n+e.sets.length,0)} sets · ${w.exercises.filter(e=>e.sets.length).length} exercises${w.started?' · '+seconds((new Date(w.ended)-new Date(w.started))/1000):''}</div><details><summary class="muted" style="margin-top:8px">View session</summary>${w.exercises.filter(e=>e.sets.length).map(e=>`<p><strong>${esc(e.name)}</strong><br>${e.sets.map(s=>`${Number(s.weight)||0} kg × ${Number(s.reps)||0}`).join(' · ')}</p>`).join('')}<button class="button danger small" onclick="deleteHistory(${state.history.length-1-i})">Delete session</button></details></div>`).join(''):'<div class="empty">Your completed workouts will appear here.</div>'}</div><div class="card"><h2>Back up your data</h2><p class="muted">Workout history is stored locally on this device, not on GitHub. Export a backup before changing devices, clearing Safari data or updating your app.</p><div class="actions"><button class="button secondary" onclick="exportData()">Export backup</button><label class="button secondary" style="margin:0">Import backup<input type="file" accept="application/json" onchange="importData(this)" style="display:none"></label></div></div>`}
function deleteHistory(i){if(confirm('Permanently delete this session?')){state.history.splice(i,1);save();render()}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='gym-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(input){const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.history)||!Array.isArray(data.programs))throw Error('Invalid backup');if(!confirm('Replace your current workouts with this backup?'))return;state=data;save();render();toast('Backup restored')}catch(e){alert('Could not import backup: '+e.message)}}
function renderProgress(){let all={};for(const w of state.history)for(const e of w.exercises)for(const s of e.sets)if(s.weight>0){all[e.name]=Math.max(all[e.name]||0,s.weight)}const entries=Object.entries(all).sort((a,b)=>b[1]-a[1]);const week=state.history.filter(w=>Date.now()-new Date(w.ended)<7*864e5).length;$('progress').innerHTML=`<div class="card"><h2>Personal bests</h2><p class="muted">Heaviest recorded working-set weight per exercise.</p>${entries.length?entries.map(([name,kg])=>`<div class="exercise flex"><strong>${esc(name)}</strong><span class="pill">${kg} kg</span></div>`).join(''):'<div class="empty">Log workouts to see your progress.</div>'}</div><div class="card"><h2>Training consistency</h2><p class="muted">Workouts in the last 7 days</p><div class="big">${week} / 3</div><div class="bar"><span style="width:${Math.min(100,week/3*100)}%"></span></div></div>`}

// V3: in-session edits are stored on the active workout, not silently applied to templates.
let editorMode='session',editorProgram=0;
function editorList(){return editorMode==='session'?state.active?.exercises:state.programs[editorProgram]?.exercises}
function closeEditor(){const el=$('editor');if(el){el.classList.add('hidden');el.innerHTML=''}}
function openEditor(mode='session',idx=0){
 if(mode==='session'&&!state.active){toast('Start a workout first');return}
 editorMode=mode;editorProgram=idx;renderEditor();$('editor').classList.remove('hidden');$('editor').scrollTop=0;
}
function renderEditor(){
 const list=editorList();if(!list)return;
 const heading=editorMode==='session'?'Edit today’s workout':'Edit your training program';
 $('editor').innerHTML=`<div class="editor-inner"><div class="editor-head"><div><div class="eyebrow">MY GYM TRACKER · V3</div><h2>${heading}</h2></div><button class="button secondary" onclick="closeEditor()">Done ✓</button></div>
 ${editorMode==='program'?`<label>Choose workout</label><select onchange="editorProgram=Number(this.value);renderEditor()">${state.programs.map((p,i)=>`<option value="${i}" ${i===editorProgram?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}
 <div class="editor-note">${editorMode==='session'?'Changes here affect only this session. Your original A/B/C program stays the same unless you tap Save to program.':'Changes here are saved for future sessions. Completed workout history is not changed.'}</div>
 ${list.map((e,i)=>`<div class="editor-row"><div class="flex"><strong>${i+1}. ${esc(exName(e))}</strong><span class="pill">${e.setsTarget||e.sets&&typeof e.sets==='number'&&e.sets||3} sets</span></div><div class="muted">${esc(e.reps||'8–12')} reps${e.superset?' · Superset '+esc(e.superset):''}${Array.isArray(e.sets)&&e.sets.length?' · '+e.sets.length+' logged sets':''}</div><div class="editor-actions"><button class="button secondary small" onclick="changeExercise(${i})">Swap / Edit</button><button class="button secondary small" onclick="moveExercise(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="button secondary small" onclick="moveExercise(${i},1)" ${i===list.length-1?'disabled':''}>↓</button><button class="button danger small" onclick="deleteExercise(${i})">Remove</button></div></div>`).join('')}
 <button class="button full" onclick="addExercise()">+ Add exercise</button>
 ${editorMode==='session'?`<button class="button secondary full" style="margin-top:12px" onclick="saveSessionToProgram()">Save today's exercise list to ${esc(state.active.name)} program</button>`:''}
 <button class="button secondary full" style="margin-top:12px" onclick="closeEditor()">Done · Return to workout</button></div>`;
}
function changeExercise(i){
 const list=editorList(),e=list[i];
 const name=prompt('Exercise name (type a replacement or keep the same):',exName(e));if(name===null)return;if(!name.trim())return alert('Exercise name cannot be empty');
 const sets=prompt('Target number of sets:',String(e.setsTarget||typeof e.sets==='number'&&e.sets||3));if(sets===null)return;
 const n=Number(sets);if(!Number.isInteger(n)||n<1||n>20)return alert('Sets must be between 1 and 20');
 const reps=prompt('Target reps (for example 8–12):',e.reps||'8–12');if(reps===null)return;
 const superset=prompt('Superset label (optional, e.g. A; leave blank for none):',e.superset||'');if(superset===null)return;
 if(editorMode==='session'){
  if(e.name!==name.trim()&&e.sets?.length&&!confirm('You already logged sets for this exercise. Keep those sets under the new exercise name?'))return;
  Object.assign(e,{name:name.trim(),setsTarget:n,reps:reps.trim(),superset:superset.trim()});
 }else list[i]={...exMeta(e),name:name.trim(),sets:n,reps:reps.trim(),superset:superset.trim()};
 save();render();renderEditor();toast('Exercise updated');
}
function addExercise(){
 const name=prompt('New exercise name:');if(name===null)return;if(!name.trim())return alert('Enter an exercise name');
 const sets=prompt('Target sets:','3');if(sets===null)return;const n=Number(sets);if(!Number.isInteger(n)||n<1||n>20)return alert('Sets must be between 1 and 20');
 const reps=prompt('Target reps:','8–12');if(reps===null)return;
 const list=editorList();list.push(editorMode==='session'?{name:name.trim(),setsTarget:n,reps:reps.trim(),sets:[]}:{name:name.trim(),sets:n,reps:reps.trim()});
 save();render();renderEditor();toast('Exercise added');
}
function deleteExercise(i){const list=editorList(),e=list[i];if(!confirm('Remove '+exName(e)+' from '+(editorMode==='session'?'this session':'this program')+'?'+(Array.isArray(e.sets)&&e.sets.length?' Its logged sets will also be removed.':'')))return;list.splice(i,1);save();render();renderEditor()}
function moveExercise(i,d){const list=editorList(),j=i+d;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];save();render();renderEditor()}
function saveSessionToProgram(){const w=state.active;const p=state.programs.find(x=>x.name===w.name);if(!p)return alert('No matching saved program');if(!confirm('Replace the exercises in '+p.name+' for all future workouts? Completed history will stay unchanged.'))return;p.exercises=w.exercises.map(e=>({name:e.name,sets:e.setsTarget||3,reps:e.reps||'8–12',...(e.superset?{superset:e.superset}:{})}));save();render();renderEditor();toast('Program saved')}

function editPrograms(){const p=state.programs.map(x=>x.name+'\n'+x.exercises.map(exName).join('\n')).join('\n\n');const v=prompt('Edit programs: first line is workout name, following lines are exercises. Separate workouts with a blank line.',p);if(v===null)return;const programs=v.trim().split(/\n\s*\n/).map(b=>{const lines=b.split('\n').map(s=>s.trim()).filter(Boolean);const old=state.programs.find(x=>x.name===lines[0]);return{name:lines[0],exercises:lines.slice(1).map(name=>old?.exercises.map(exMeta).find(e=>e.name===name)||{name,sets:3,reps:'8–12'})}}).filter(p=>p.name&&p.exercises.length);if(!programs.length){alert('Add at least one workout and exercise.');return}state.programs=programs;save();render();toast('Program updated')}
function render(){renderHome();renderWorkout();renderHistory();renderProgress()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
